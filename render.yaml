services:
  - type: web
    name: dmw-hris-pre-deployment
    runtime: docker
    plan: free
    region: singapore
    branch: pre-deployment
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: DMW HRIS Pre-deployment
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY_SEED
        generateValue: true
      - key: PRESENTATION_MODE
        value: "true"
      - key: PRESENTATION_PASSWORD
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: dmw-hris-presentation-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_HTTP_ONLY
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: MAIL_MAILER
        value: disabled
      - key: LOG_CHANNEL
        value: stderr
      - key: PDF_BROWSER_PATH
        value: /usr/bin/chromium
      - key: LOCATOR_ALLOW_WEEKENDS
        value: "false"
databases:
  - name: dmw-hris-presentation-db
    plan: free
    region: singapore
    databaseName: dmw_hris_presentation
    user: dmw_hris_demo
    ipAllowList: []
